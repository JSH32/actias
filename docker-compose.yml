services:
  postgres:
    # The major version and the volume mount are coupled. Up to 17 the data
    # directory is /var/lib/postgresql/data; from 18 it is
    # /var/lib/postgresql/<major>/ and the server refuses to start against a
    # volume mounted at the old path. Change both together or neither.
    image: postgres:17
    restart: always
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    environment:
      # These are the variable names the official image reads. The superuser is
      # created from them; init.sql only adds the per-service databases.
      - POSTGRES_USER=${POSTGRES_USER:-actias}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actias}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  scylla:
    image: scylladb/scylla
    container_name: scylla
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: [ "CMD-SHELL", "[ $$(nodetool statusgossip) = running ]" ]
      interval: 30s
      timeout: 10s
      retries: 5

  script_service:
    image: ghcr.io/jsh32/actias_script_service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      script_service_migration:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-script-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_script_service
      - REDIS_URL=redis://redis:6379

  script_service_migration:
    image: ghcr.io/jsh32/actias_script_service_migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./actias-script-service
      dockerfile: ./Dockerfile.migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_script_service

  worker_service:
    image: ghcr.io/jsh32/actias_worker_service:latest
    restart: unless-stopped
    depends_on:
      - script_service
      - kv_service
      - redis
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-worker
    environment:
      - PORT=3000
      - SCRIPT_SERVICE_URI=http://script_service:3000
      - KV_SERVICE_URI=http://kv_service:3000
      # Carries script log lines to the live tail subscribers.
      - REDIS_URL=redis://redis:6379
      # Development-only key; a deployment must set its own.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - 3002:3000

  # The service image is its own migrator, so the schema can never drift from
  # the binary that applies it.
  kv_migration:
    image: ghcr.io/jsh32/actias_kv_service:latest
    depends_on:
      scylla:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-kv
    command: ["/app/target", "--migrate"]
    environment:
      - SCYLLA_NODES=scylla:9042

  kv_service:
    image: ghcr.io/jsh32/actias_kv_service:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-kv
    depends_on:
      scylla:
        condition: service_healthy
      kv_migration:
        condition: service_completed_successfully
    environment:
      - PORT=3000
      - SCYLLA_NODES=scylla:9042

  actias_api_migration:
    image: ghcr.io/jsh32/actias_api_migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./actias-api
      dockerfile: ./Dockerfile.migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_api

  actias_api:
    image: ghcr.io/jsh32/actias_api:latest
    restart: unless-stopped
    ports:
      - 3001:3000
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      actias_api_migration:
        condition: service_completed_successfully
      kv_service:
        condition: service_started
      script_service:
        condition: service_started
    environment:
      - INVITE_ONLY=${INVITE_ONLY:-false}
      - SCRIPT_SERVICE_URL=script_service:3000
      - KV_SERVICE_URL=kv_service:3000
      - JWT_KEY=${JWT_KEY:-secret}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_api
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      # Development-only key, must match the worker's; a deployment sets its own.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  actias_web:
    image: ghcr.io/jsh32/actias_web:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    build:
      context: ./actias-web
    depends_on:
      - actias_api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=${API_URL:-http://localhost:3001}
      - WORKER_BASE=${WORKER_URL:-http://localhost:3002}/_IDENTIFIER_

volumes:
  scylla_data:
  postgres_data:
  redis_data:
