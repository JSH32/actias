services:
  postgres:
    # The major version and the volume mount are coupled. Up to 17 the data
    # directory is /var/lib/postgresql/data; from 18 it is
    # /var/lib/postgresql/<major>/ and the server refuses to start against a
    # volume mounted at the old path. Change both together or neither.
    image: postgres:17
    restart: always
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    environment:
      # These are the variable names the official image reads. The superuser is
      # created from them; init.sql only adds the per-service databases.
      - POSTGRES_USER=${POSTGRES_USER:-actias}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actias}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  script_service:
    image: ghcr.io/jsh32/actias_script_service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      script_service_migration:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-script-service
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4317}
      - OTEL_SERVICE_NAME=actias_script_service
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_script_service
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Node liveness ttl; leases live exactly this long past a heartbeat.
      - NODE_TTL_SECS=${NODE_TTL_SECS:-45}

  script_service_migration:
    image: ghcr.io/jsh32/actias_script_service_migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./actias-script-service
      dockerfile: ./Dockerfile.migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_script_service

  secret_service:
    image: ghcr.io/jsh32/actias_secret_service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      secret_service_migration:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-secret-service
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4317}
      - OTEL_SERVICE_NAME=actias_secret_service
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_secret_service
      # The active master key; it only ever wraps per-version data keys.
      - SECRET_MASTER_KEY=${SECRET_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      - SECRET_MASTER_KEY_ID=${SECRET_MASTER_KEY_ID:-kek-1}

  secret_service_migration:
    image: ghcr.io/jsh32/actias_secret_service_migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./actias-secret-service
      dockerfile: ./Dockerfile.migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_secret_service

  worker_service:
    image: ghcr.io/jsh32/actias_worker_service:latest
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      script_service:
        condition: service_started
      kv_service:
        condition: service_started
      secret_service:
        condition: service_started
      redis:
        condition: service_started
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-worker
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4317}
      - OTEL_SERVICE_NAME=actias_worker_1
      - PORT=3000
      - SCRIPT_SERVICE_URI=http://script_service:3000
      - KV_SERVICE_URI=http://kv_service:3000
      # Carries script log lines to the live tail subscribers.
      - REDIS_URL=redis://redis:6379
      # Bundle bytes are pulled straight from the blob store by hash;
      # only manifests travel through script-service.
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Workers hold no key material; secrets resolve through the service.
      - SECRET_SERVICE_URI=http://secret_service:3000
      # Subdomain routing for anything resolving under this base; the
      # path-prefix forms keep working for direct access.
      - BASE_DOMAIN=${BASE_DOMAIN:-scripts.localhost}
      # One SQLite file per durable object; the volume IS their persistence.
      - OBJECT_DATA_DIR=/data/objects
      - OBJECT_SWEEP_SECS=${OBJECT_SWEEP_SECS:-30}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token}
      - OBJECT_REPLICA_TTL_SECS=${OBJECT_REPLICA_TTL_SECS:-30}
      # The WorkerData grpc service: object dispatch and typed reads;
      # the address the node registers is this listener's.
      - WORKER_GRPC_PORT=3100
    volumes:
      - objects_data:/data/objects
    ports:
      - "${ACTIAS_WORKER_PORT:-3002}:3000"
      - "${ACTIAS_WORKER_DATA_PORT:-3102}:3100"

  # A second node: same image, its own object volume. Two nodes is what
  # makes leases, forwarding and failover observable locally.
  worker_service_2:
    image: ghcr.io/jsh32/actias_worker_service:latest
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      script_service:
        condition: service_started
      kv_service:
        condition: service_started
      secret_service:
        condition: service_started
      redis:
        condition: service_started
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-worker
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4317}
      - OTEL_SERVICE_NAME=actias_worker_2
      - PORT=3000
      - SCRIPT_SERVICE_URI=http://script_service:3000
      - KV_SERVICE_URI=http://kv_service:3000
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SECRET_SERVICE_URI=http://secret_service:3000
      - BASE_DOMAIN=${BASE_DOMAIN:-scripts.localhost}
      - OBJECT_DATA_DIR=/data/objects
      - OBJECT_SWEEP_SECS=${OBJECT_SWEEP_SECS:-30}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token}
      - OBJECT_REPLICA_TTL_SECS=${OBJECT_REPLICA_TTL_SECS:-30}
      # The WorkerData grpc service: object dispatch and typed reads;
      # the address the node registers is this listener's.
      - WORKER_GRPC_PORT=3100
    volumes:
      - objects_data_2:/data/objects
    ports:
      - "${ACTIAS_WORKER2_PORT:-3003}:3000"
      - "${ACTIAS_WORKER2_DATA_PORT:-3103}:3100"

  # The service image is its own migrator, so the schema can never drift from
  # the binary that applies it.
  kv_migration:
    image: ghcr.io/jsh32/actias_kv_service:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-kv
    command: ["/app/target", "--migrate"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_kv

  kv_service:
    image: ghcr.io/jsh32/actias_kv_service:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rust
      args:
        CRATE_NAME: actias-kv
    depends_on:
      postgres:
        condition: service_healthy
      kv_migration:
        condition: service_completed_successfully
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4317}
      - OTEL_SERVICE_NAME=actias_kv_service
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_kv

  actias_api_migration:
    image: ghcr.io/jsh32/actias_api_migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./actias-api
      dockerfile: ./Dockerfile.migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_api

  actias_api:
    image: ghcr.io/jsh32/actias_api:latest
    restart: unless-stopped
    ports:
      - "${ACTIAS_API_PORT:-3001}:3000"
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      actias_api_migration:
        condition: service_completed_successfully
      kv_service:
        condition: service_started
      secret_service:
        condition: service_started
      script_service:
        condition: service_started
    environment:
      # Observability, pluggable: empty ACTIAS_OTEL unplugs it.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACTIAS_OTEL:-http://otel:4318}
      - OTEL_SERVICE_NAME=actias_api
      - INVITE_ONLY=${INVITE_ONLY:-false}
      - SCRIPT_SERVICE_URL=script_service:3000
      - KV_SERVICE_URL=kv_service:3000
      - JWT_KEY=${JWT_KEY:-secret}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-actias}:${POSTGRES_PASSWORD:-secret}@postgres/actias_api
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      # Development-only key, must match the worker's; a deployment sets its own.
      - SECRET_SERVICE_URL=secret_service:3000
      # Dashboard dispatches and reads reach a worker's data plane
      # directly, cluster-internal only.
      - WORKER_GRPC_URL=worker_service:3100
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token}

  actias_web:
    image: ghcr.io/jsh32/actias_web:latest
    restart: unless-stopped
    ports:
      - "${ACTIAS_WEB_PORT:-3000}:3000"
    build:
      context: .
      dockerfile: ./actias-web/Dockerfile
    depends_on:
      - actias_api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=${API_URL:-http://localhost:3001}
      - WORKER_BASE=${WORKER_URL:-http://localhost:3002}/_IDENTIFIER_
      - WORKER_REVISION_BASE=${WORKER_URL:-http://localhost:3002}/_rev/_IDENTIFIER_/_REVISION_

  # Observability backend, pluggable: the all-in-one grafana bundle
  # (grafana + tempo + loki + prometheus) with OTLP in on 4317/4318.
  # Services point OTEL_EXPORTER_OTLP_ENDPOINT here; set ACTIAS_OTEL to
  # an empty value to unplug exporting without touching this container,
  # or point it at external infrastructure instead.
  otel:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "${ACTIAS_GRAFANA_PORT:-3030}:3000"
    volumes:
      - grafana_data:/data
      # The bundle's prometheus config plus the worker /_metrics scrape.
      - ./docker/otel/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      # Replaces the demo dashboards (RED, JVM) with the actias set.
      - ./docker/otel/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./docker/otel/dashboards:/otel-lgtm/actias-dashboards:ro

volumes:
  objects_data:
  objects_data_2:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
