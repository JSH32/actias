[workspace]
resolver = "3"

members = [
    "actias-worker",
    "actias-worker-core",
    "actias-common",
    "actias-declarations",
    "actias-script-service",
    "actias-secret-service",
    "actias-cli",
    "actias-kv",
    "actias-placement",
]

[workspace.package]
# The one version everything releases as, pre-1.0 lockstep: members,
# both node packages and the chart move together via `just release`.
version = "0.1.0"

[workspace.dependencies]
actias-common = { path = "./actias-common" }
actias-declarations = { path = "./actias-declarations" }
blake3 = "1.8.6"
tokio = { version = "1.23.0", features = ["full"] }
tonic = "0.13.0"
tonic-health = "0.13.0"
prost = "0.13.5"
tonic-build = "0.13.0"
prost-build = "0.13.5"
