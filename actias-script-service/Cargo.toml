[package]
name = "actias-script-service"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actias-common = { workspace = true, features = ["otel", "postgres"] }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.2.2", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "uuid",
    "chrono",
    "migrate",
] }
deadpool-redis = { version = "0.13.0" }
futures = "0.3.29"

prost = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
blake3 = { workspace = true }
aws-sdk-s3 = "1.142.0"
aws-config = "1.10.1"
aws-credential-types = "1.3.0"
actias-declarations = { version = "0.1.0", path = "../actias-declarations" }

[build-dependencies]
tonic-build = { workspace = true }
prost-build = { workspace = true }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["redis", "postgres", "minio"] }
