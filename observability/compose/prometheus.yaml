# The lgtm bundle's own prometheus config (kept verbatim below the
# marker) plus the actias scrape jobs: the workers publish hand-rolled
# text at /_metrics, and this is what pulls it into the dashboards.
# Mounted over /otel-lgtm/prometheus.yaml by docker-compose.
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias
storage:
  tsdb:
    out_of_order_time_window: 10m

# Actias additions below.
scrape_configs:
  - job_name: actias-workers
    metrics_path: /_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["worker_service:3000"]
        labels:
          node: worker_1
      - targets: ["worker_service_2:3000"]
        labels:
          node: worker_2
