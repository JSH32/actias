[package]
name = "actias-worker-core"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
actias-declarations = { workspace = true }
actias-common = { workspace = true, features = ["otel"] }
blake3 = { workspace = true }
mlua = { version = "0.11", features = [
    "luau-jit",
    "serialize",
    "send",
    "async",
] }
serde_json = "1.0.91"
serde = { version = "1.0.152", features = ["derive"] }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
jsonwebtoken = "9.3.1"
argon2 = "0.5.2"
sha2 = "0.10.8"
rsa = { version = "0.9.3" }
# The lua response converts into the server's wire body type here, so the
# script surface stays identical wherever the runtime is embedded.
axum = "0.8"
reqwest = "0.13.4"
http = "1.5.0"
url = "2.5.8"
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
# Cron expression parsing for `on "cron:<expr>"` schedules.
cron = "0.12"
chrono = "0.4"
# Per-object durable storage; bundled so the image needs no system sqlite.
rusqlite = { version = "0.29", features = ["bundled", "hooks"] }

[build-dependencies]
tonic-build = { workspace = true }
prost-build = { workspace = true }

[dependencies.uuid]
version = "1.5.0"
features = ["v4", "fast-rng", "macro-diagnostics"]

[dev-dependencies]
tempfile = "3.27.0"
