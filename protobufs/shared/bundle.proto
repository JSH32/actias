syntax = "proto3";
package bundle;

// A revision's content: the entry point plus every file in the bundle.
message Bundle {
    string entry_point = 1;
    repeated File files = 2;
}

// One file in a bundle.
message File {
    string revision_id = 1;
    string file_name = 2;
    string file_path = 3;
    bytes content = 5;
}
