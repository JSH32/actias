syntax = "proto3";

import "google/protobuf/empty.proto";

package secret_service;

// Project secrets: versioned, envelope-encrypted at rest, write-only on the
// management plane. Values leave this service only through ResolveSecret,
// which workers call when a script declares `secret "name"`.
service SecretService {
    // Creates or rotates: always inserts a new immutable version and
    // returns its metadata. There is no in-place update.
    rpc SetSecret(SetSecretRequest) returns (SecretMeta);

    // Tombstones the name: it leaves listings and head resolution, while
    // already-pinned versions keep resolving so running workflows finish
    // with the credentials they started with.
    rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty);

    // Names and metadata for the console and CLI; never values.
    rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

    // Plaintext for one secret: the head when version is 0, or exactly the
    // requested version (a workflow replay's pin). NOT_FOUND for unknown
    // names, tombstoned heads, and versions that never existed.
    rpc ResolveSecret(ResolveSecretRequest) returns (ResolvedSecret);

    // One name's version metadata, newest first, tombstones included: the
    // console's rotation history. Values never ride along.
    rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
}

message ListSecretVersionsRequest {
    string project_id = 1;
    string name = 2;
}

message SecretVersion {
    uint64 version = 1;
    // Unix milliseconds this version was written.
    int64 created_ms = 2;
    // User id that wrote it; audit metadata, never identity.
    string created_by = 3;
    // Unix milliseconds this version was tombstoned; 0 while live.
    int64 deleted_ms = 4;
}

message ListSecretVersionsResponse {
    // Every version ever written under the name, newest first; empty for
    // names never set.
    repeated SecretVersion versions = 1;
}

message SetSecretRequest {
    string project_id = 1;
    string name = 2;
    // The plaintext value; encrypted before it touches storage and never
    // returned by any management rpc.
    string value = 3;
    // User id that performed the write; audit metadata, never identity.
    string created_by = 4;
}

message DeleteSecretRequest {
    string project_id = 1;
    string name = 2;
}

message ListSecretsRequest {
    string project_id = 1;
}

message SecretMeta {
    string name = 1;
    // Head version at the time of the call.
    uint64 version = 2;
    // Unix milliseconds of the head version's write.
    int64 created_ms = 3;
    string created_by = 4;
}

message ListSecretsResponse {
    // Live (non-tombstoned) names, name-ordered.
    repeated SecretMeta secrets = 1;
}

message ResolveSecretRequest {
    string project_id = 1;
    string name = 2;
    // 0 resolves the head; a workflow replay passes its pinned version.
    uint64 version = 3;
    // Script whose vm asked; audit metadata today, the enforcement point
    // when script.json bindings land, without a proto change.
    string script_id = 4;
}

message ResolvedSecret {
    string value = 1;
    // The version the value came from; what a workflow's first resolve pins.
    uint64 version = 2;
}
