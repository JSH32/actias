syntax = "proto3";

package worker_data;

// The worker's data plane, served by every worker node: object method
// dispatch and typed reads against object storage. This is the only way
// into an object from outside a vm; the api's dashboard calls and
// worker-to-worker forwards both travel it. Callers authenticate with the
// cluster-internal token in `x-actias-internal` metadata; nothing here is
// ever reachable from outside the cluster.
service WorkerData {
    // One object method call. The receiving node resolves the owner
    // script's current revision itself, so every route into an object
    // runs the same code. Method failures ride the result envelope
    // (they are the object's own user-safe errors, addressed to the
    // calling script); a Status means the transport itself failed.
    rpc Dispatch(ObjectCall) returns (CallResult);

    // One shell chunk, run in a fresh vm on this node under the session's
    // grants: the operator's principal binds what the api says the
    // operator may open. Prints come back with the value; a failure is
    // the chunk's own error, addressed to the person typing.
    rpc RunShell(ShellRun) returns (ShellOutcome);

    // One typed read against an object's storage, no vm: queue stats or
    // message rows, a database or user object's overview, or one
    // read-only SQL statement under the script authorizer. Routed to the
    // freshest copy: the local file, else the lease holder's node, else
    // the shipped snapshot replica, else null.
    rpc ReadStats(ReadRequest) returns (ReadValue);

    // The queue's journal after the `since` cursor, oldest first; routed
    // exactly like ReadStats.
    rpc ReadJournal(ReadRequest) returns (ReadValue);

    // Node-grouped connection delivery: one call carries every due
    // stream event for every followed connection this node hosts, and
    // the node fans out to its own sockets. The reply names the
    // connections that are gone so the publisher prunes their edges;
    // everything else advanced regardless (connection edges are
    // at-most-once). Publish cost is nodes listening, never listeners.
    rpc DeliverInbox(InboxBatch) returns (InboxReceipts);

    // Node-grouped delivery for DURABLE followers: the node dispatches
    // __receive to each of its resident follower objects in order and
    // reports how far each got. The follower's own receive cursor
    // makes any redelivery skip, so at-least-once stays safe to
    // repeat.
    rpc DeliverReceives(ReceiveBatch) returns (ReceiveReceipts);

    // One listing over a class's directory: the rows every object in
    // the class contributes, answered from the node's own overlay of
    // the class's base and deltas. No object is woken and no lease is
    // taken; the answer trails each object's last settled write.
    rpc ListDirectory(DirectoryQuery) returns (DirectoryPage);

    // The verified read: the same query, with every candidate checked
    // against its object's own shipping manifest before it is served.
    // A row that stopped matching is dropped, a fresher row is served
    // fresh, and a row that cannot be checked is returned FLAGGED
    // rather than dropped, because a lost row is the one failure the
    // directory refuses. Still no waking and no leases: the common
    // case costs one small manifest read per candidate, never a
    // restore. Limit bounds candidates EXAMINED, so a page may return
    // fewer entries than asked plus a cursor.
    rpc VisitDirectory(DirectoryQuery) returns (VisitPage);

    // Rebuilds one class's index from the placement store's live
    // identities and each object's shipping manifest, waking nothing.
    //
    // Background reconciliation discovers classes by listing the
    // store, so a class whose prefix is gone entirely cannot be found
    // at all: nothing names it. A name can always be asked for, which
    // is why total loss is an operator's verb rather than a timer's
    // job.
    rpc RebuildDirectory(DirectoryRebuild) returns (DirectoryRebuilt);

    // Tail replication. The lease holder appends its committed WAL
    // prefix to K replica nodes as it ships it, and a written call is
    // answered once Q of them have it durably; the blob store keeps
    // shipping behind the answer. A replica appends bytes at an offset
    // and checks a fence; it never interprets them. A duplicate at an
    // offset it already holds is acked, a gap is refused with the
    // length it does hold so the owner resends from there, and an
    // epoch below its fence is refused outright.
    rpc AppendWal(WalAppend) returns (WalAppended);

    // What a replica holds for one generation, raising its fence to
    // `fence_to` first: a takeover at epoch e+1 asks every replica the
    // manifest names, and once Q have answered, an owner at e can never
    // assemble Q acks again.
    rpc ReplicaState(ReplicaQuery) returns (ReplicaInfo);

    // The replica's copy, base then WAL, in chunks: what a takeover lays
    // down instead of restoring from the store.
    rpc FetchReplica(ReplicaQuery) returns (stream ReplicaChunk);

    // What the owner has answered to callers so far for one object: the
    // generation and the WAL length its last released flight reached. A
    // replica serves a read from its own copy only once the copy has
    // reached this, so a read on any node sees every write a caller was
    // told succeeded, without any token crossing requests.
    rpc Watermark(WatermarkQuery) returns (WatermarkInfo);
    // A generation start: the owner lays a base on the replica as a
    // stream of parts, a header naming the chunk list and then the
    // chunks the replica lacks. A replica on the header's previous list
    // is sent only the chunks a rotation dirtied and patches its base in
    // place; one that is not answers NO_BASE and is sent every chunk.
    rpc LayGeneration(stream GenerationPart) returns (WalAppended);
    // The live connections a project holds, both directions. The node
    // asked answers for itself and, unless `local_only`, asks every
    // other live node the same question, so one call lists the cluster.
    rpc ListConnections(ConnectionQuery) returns (ConnectionList);
}

message ConnectionQuery {
    // Empty lists every project's; the api always names one.
    string project_id = 1;
    bool local_only = 2;
}

message ConnectionRow {
    string id = 1;
    // The declared connection class running the wire.
    string connection_class = 2;
    // The identity it speaks as.
    string class = 3;
    string name = 4;
    // "inbound" (a client's upgrade) or "outbound" (dialled by the project).
    string direction = 5;
    // The far side's host, outbound only.
    string peer = 6;
    string node = 7;
    string project_id = 8;
    string script_id = 9;
    int64 opened_at_ms = 10;
    // "new", "warm" or "hibernated".
    string status = 11;
    uint32 follows = 12;
}

message ConnectionList {
    repeated ConnectionRow connections = 1;
}

message WatermarkQuery {
    string object_id = 1;
}

message WatermarkInfo {
    // False when this node does not hold the object resident.
    bool held = 1;
    // The residency's lease epoch, whether or not a flight has released.
    uint64 epoch = 2;
    uint64 base = 3;
    // WAL bytes the owner's last released flight reached.
    uint64 length = 4;
    // False until the residency's first flight has released: no copy
    // anywhere can be vouched for before that, and a reader forwards.
    bool released = 5;
}

message WalAppend {
    string object_id = 1;
    // The owner's lease epoch and the generation's base index; together
    // they name the WAL these bytes belong to.
    uint64 epoch = 2;
    uint64 base = 3;
    // Byte offset in the generation's WAL these bytes start at.
    uint64 offset = 4;
    bytes bytes = 5;
    // How far the store's manifest covers this WAL; informational, for
    // eviction.
    uint64 covered = 7;
}

message GenerationPart {
    oneof part {
        GenerationHeader header = 1;
        GenerationChunk chunk = 2;
        GenerationDone done = 3;
    }
}

message GenerationHeader {
    string object_id = 1;
    uint64 epoch = 2;
    uint64 base = 3;
    // The hash of the chunk list this delta applies to, hex; empty when
    // every chunk follows.
    string from_list = 4;
    // The base file's length after the lay.
    uint64 base_len = 5;
    // The new generation's chunk list: one blake3 hex per CHUNK_BYTES
    // of the base, in order.
    repeated string chunks = 6;
}

message GenerationChunk {
    // Which range of the base these bytes are; the last chunk is short.
    uint32 index = 1;
    bytes bytes = 2;
}

message GenerationDone {}

message WalAppended {
    // The WAL length the replica holds after the call.
    uint64 length = 1;
    // True when the bytes were appended (or already held). False with
    // `refusal` set: a gap (resend from `length`), a missing generation
    // (resend with the base), or a fence.
    bool applied = 2;
    string refusal = 3;
}

message ReplicaQuery {
    string object_id = 1;
    uint64 epoch = 2;
    uint64 base = 3;
    // Raise the replica's fence to this epoch before answering; 0
    // leaves it.
    uint64 fence_to = 4;
}

message ReplicaInfo {
    // Whether the replica holds this generation at all.
    bool held = 1;
    uint64 length = 2;
    uint64 fence = 3;
}

message ReplicaChunk {
    // Base bytes come first, then WAL bytes; a chunk carries one kind.
    bytes base = 1;
    bytes wal = 2;
}

message DirectoryRebuild {
    string scope_id = 1;
    string class = 2;
}

message DirectoryRebuilt {
    // Identities the placement store still lists as live.
    uint64 live = 1;
    // Rows recovered from manifests.
    uint64 rows = 2;
    // Live objects whose manifest carries no row yet. Not an error:
    // nothing has settled to copy, and a backfill is what covers them.
    uint64 without_row = 3;
    // Rows retired because the object no longer exists.
    uint64 tombstones = 4;
    // Whether this node did the work. False means another node holds
    // the class's lease and is rebuilding it already.
    bool held = 5;
}

// A predicate over one directory field. Values are json-encoded so one
// shape carries every kind a field may hold, arrays included.
message DirectoryCondition {
    // Field name as the class's directory function returned it; nested
    // tables arrive flattened, so "location.region" is one field.
    string field = 1;
    // "eq", "ne", "lt", "lte", "gt", "gte", "one_of", "starts_with",
    // "contains", "exists". One_of rather than in, because `in` is a
    // lua keyword and the wire uses the word the author types. Unknown
    // operators are refused rather than ignored, so a newer caller
    // never silently loses a filter.
    string op = 2;
    // The operand, json-encoded: a scalar, an array for one_of, or a
    // boolean for "exists".
    string value_json = 3;
}

// A conjunction of conditions, with nested combinators. The tree is
// carried rather than a query string: the worker translates it into
// parameterized sql, so no caller can shape an identifier.
message DirectoryWhere {
    repeated DirectoryCondition conditions = 1;
    // OR over sub-wheres.
    repeated DirectoryWhere any = 2;
    // Explicit AND, for grouping inside an `any`.
    repeated DirectoryWhere all = 3;
    // NOT over sub-wheres.
    repeated DirectoryWhere none = 4;
}

message DirectoryOrder {
    string field = 1;
    bool descending = 2;
}

message DirectoryQuery {
    // The project the class belongs to.
    string scope_id = 1;
    string class = 2;
    DirectoryWhere where = 3;
    repeated DirectoryOrder order = 4;
    // Rows this page may carry; the worker caps it.
    int64 limit = 5;
    // From a previous page; absent starts at the beginning.
    optional string cursor = 6;
}

// One object's row.
message DirectoryEntry {
    string name = 1;
    string object_id = 2;
    // Field name to json-encoded value, for the fields the class
    // exposes and this object has.
    map<string, string> fields = 3;
}

// One verified candidate. Verified entries carry the object's settled
// row (which may be fresher than what the index held); flagged entries
// carry the indexed row and say why it could not be checked.
message VisitEntry {
    DirectoryEntry entry = 1;
    // The row could not be verified; it is served anyway, saying so,
    // because dropping it would manufacture the false negative the
    // directory exists to refuse.
    bool unverified = 2;
    // Why, when unverified; empty otherwise.
    string reason = 3;
}

message VisitPage {
    repeated VisitEntry entries = 1;
    // Continues where this page's CANDIDATES ended: verification may
    // drop rows, so a short page with a cursor is normal, not the end.
    optional string cursor = 2;
    // Same contract as DirectoryPage.building.
    repeated string building = 3;
}

message DirectoryPage {
    repeated DirectoryEntry entries = 1;
    // Feeds the next query; absent on the last page.
    optional string cursor = 2;
    // Fields still building, if any. A query naming one is refused
    // outright; this reports the rest so a console can show progress
    // rather than leaving a column mysteriously missing.
    repeated string building = 3;
}

// Due events for the connections one node hosts. The events ride
// once per batch; each edge names the slice it gets, so the payload
// never multiplies by listeners.
message InboxBatch {
    // A json array of {seq, topic, from_class, from_name, data}
    // objects, in publish order.
    string events_json = 1;
    repeated InboxEdge edges = 2;
}

// One followed connection's slice of the batch.
message InboxEdge {
    string connection = 1;
    string topic = 2;
    // Events at or below this seq were already heard.
    int64 after = 3;
    // Empty forwards everything on the topic; anything else is a json
    // object matched against event data.
    string filter_json = 4;
}

message InboxReceipts {
    // Connections the node no longer holds; their edges are dead.
    repeated string gone = 1;
}

// Due events for the durable followers one node hosts, from one
// publisher. Small sets ride inline; past the cap only the range
// travels and the node reads the events from the nearest copy of the
// publisher's log (usually its own replica).
message ReceiveBatch {
    string scope_id = 1;
    string publisher_class = 2;
    string publisher_name = 3;
    repeated ReceiveEntry entries = 4;
}

message ReceiveEntry {
    string follower_class = 1;
    string follower_name = 2;
    // Inline: a json array of {seq, topic, from_class, from_name,
    // data}; empty when a range travels instead.
    string events_json = 3;
    // The range (after, upto], meaningful when events_json is empty.
    int64 range_after = 4;
    int64 range_upto = 5;
    string topic = 6;
    // The edge's filter, json-encoded; empty means unfiltered. Range
    // reads apply it where the events materialize.
    string filter_json = 7;
}

message ReceiveReceipts {
    repeated ReceiveOutcome outcomes = 1;
}

message ReceiveOutcome {
    string follower_class = 1;
    string follower_name = 2;
    // Highest seq whose handler committed; 0 when nothing landed.
    int64 delivered_to = 3;
    // True when delivery stopped early; the publisher backs the edge
    // off exactly as a per-event failure would have.
    bool failed = 4;
}

// What one object call carries: the identity and the call, never code
// coordinates.
message ObjectCall {
    // The identity scope: the project id (cron objects never travel this
    // transport; their scope is their script).
    string scope_id = 1;
    string class = 2;
    string name = 3;
    string method = 4;
    // The call's arguments as one json array; user method arguments are
    // arbitrary values, so they stay json on the wire.
    string arguments_json = 5;
    // The object-call stack this call rides on, target included when the
    // sender already extended it; what makes cycles refusable.
    repeated string chain = 6;
    // The producing script's identity, carried across hops; absent for
    // dashboard dispatches, which have no script behind them.
    optional Caller caller = 7;
    // True when the caller is not a worker: a first hop may forward once
    // to the lease holder. Worker-to-worker calls arrive with the hop
    // already spent, so a stale lease view can never bounce a call
    // between nodes.
    bool first_hop = 8;
}

// The calling script's identity as it travels between nodes.
message Caller {
    // Public identifier, the name a human recognizes.
    string script = 1;
    // Revision id the caller executed as.
    string revision = 2;
}

// One dispatched call's outcome.
// A shell chunk and what it may bind. The grants stand in for a
// contract: a shell session publishes nothing, so the api derives them
// from what the project holds and the operator may open.
message ShellRun {
    string scope_id = 1;
    // The chunk, as typed or pasted; its return value is the result.
    string source = 2;
    repeated string kv = 3;
    repeated string databases = 4;
    repeated string objects = 5;
    // Wall budget for the run; the node caps it.
    uint64 wall_secs = 6;
    // Whether the session may write. A read-only chunk still runs: the
    // vm refuses kv set/delete, database exec and method calls inside
    // it, which is what makes an ad hoc join safe to type without
    // ceremony.
    bool write = 7;
}

message ShellOutcome {
    // The chunk's return value as json; "null" for nothing.
    string value_json = 1;
    // Every print and log line, in order.
    repeated string output = 2;
    // The chunk's own error, when it failed.
    string error = 3;
    // Work units and milliseconds the run consumed.
    uint64 work = 4;
    uint64 wall_ms = 5;
}

message CallResult {
    // The method's return value, json-encoded; meaningful only when
    // `error` is empty.
    string result_json = 1;
    // The call's failure exactly as the object's runtime produced it,
    // user-safe; empty on success.
    string error = 2;
    // Set when this node does not hold the object: the caller's view of
    // the home is stale, and it should re-resolve instead of retrying
    // here. `error` still carries a message for logs.
    bool wrong_home = 3;
    // Set when this node is in the object's birth region and the object
    // lives in another region now: the caller remembers the region and
    // forwards there once (FLEET.md 4.2). `error` says so for logs.
    string moved_to = 4;
}

// What one read asks for; ReadStats and ReadJournal share it because
// both name an object and route the same way.
message ReadRequest {
    // The identity scope: the project id.
    string scope_id = 1;
    string class = 2;
    string name = 3;
    // One read-only SQL statement under the same authorizer script SQL
    // runs with, instead of the class's typed overview (ReadStats only).
    optional string sql = 4;
    // The queue's live and dead message rows instead of its stats
    // summary (ReadStats only, queue class only).
    bool messages = 5;
    // Journal cursor: rows strictly after this id (ReadJournal only).
    int64 since = 6;
    // True when the caller is not a worker: a first hop may forward once
    // to the lease holder for the freshest copy. A forwarded read
    // answers from what its node has and never forwards again.
    bool first_hop = 7;
    // The publisher's edge table plus its event-log head instead of the
    // class's overview (ReadStats only): the console's followers panel.
    bool followers = 8;
    // The object's reserved state pairs instead of the class's overview
    // (ReadStats only): the console's State tab. The pairs are denied to
    // `sql` by the authorizer, so this is their only read.
    bool state = 9;
}

// One read's answer.
message ReadValue {
    // The value, json-encoded; `null` when the object has no observable
    // state anywhere (nothing local, nothing ever shipped), which reads
    // as empty, not as an error.
    string value_json = 1;
}
