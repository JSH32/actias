syntax = "proto3";
package script_service;

import "shared/bundle.proto";
import "google/protobuf/empty.proto";

message ListScriptRequest {
    int32 page_size = 1;
    int32 page = 2;
    // Project ID to query by.
    string project_id = 3;
}

message ListScriptResponse {
    int32 page = 1;
    int32 total_pages = 2;
    repeated Script scripts = 3;
}

// Create a new script.
// This will create a new revision if the script already exists.
message CreateScriptRequest {
    string project_id = 1;
    // Public identifier of the script.
    string public_identifier = 2;
}

message DeleteScriptRequest {
    string script_id = 1;
}

// Delete all scripts belonging to a project.
message DeleteProjectRequest {
    string project_id = 1;
}

message ProjectRef {
    string project_id = 1;
}

// A project's runtime policy: what its scripts may spend on a node and
// where they may reach. A zero rate means the platform default
// (unbounded); an empty allow list admits every host the deny list and
// the node's own policy do not refuse.
message ProjectPolicy {
    string project_id = 1;
    // Requests a node admits for the project per second, with a burst
    // of the same size.
    uint32 requests_per_sec = 2;
    // Work units a node lets the project spend per second; a request
    // that overspends puts the project in debt until it refills.
    uint64 work_units_per_sec = 3;
    // Hosts outbound requests and dials may reach; a leading dot
    // matches subdomains. Empty admits everything not denied.
    repeated string egress_allow = 4;
    // Hosts refused before the allow list is consulted.
    repeated string egress_deny = 5;
    // The project's home region: where its named objects are born and
    // its directory lives. Read here, set by SetProjectRegion.
    string region = 6;
    // Whether the project is between homes: claims for its scope are
    // refused with a retryable answer until the move completes.
    bool moving = 7;
}

// Sets a project's home region; the region must be a token of the
// grammar and, when regions are registered, a registered one.
message SetProjectRegionRequest {
    string project_id = 1;
    string region = 2;
}

// A region the control plane knows: how its data plane is reached and
// which bucket holds its bytes.
message Region {
    string name = 1;
    string data_plane_addr = 2;
    // The region's object bucket: what its workers ship to and a move
    // copies between.
    string bucket = 3;
    // The region's placement service, as the control plane reaches it;
    // a move lists the project's objects there. Workers never cross
    // regions to a placement service.
    string placement_addr = 4;
    // The region's own object storage, when it is not the control
    // plane's: the endpoint and the credentials a move copies with.
    // Empty means the control plane's S3 settings reach the bucket.
    string s3_endpoint = 5;
    string s3_access_key = 6;
    string s3_secret_key = 7;
}

// A project's move between homes, as the console follows it: one row
// per project, the latest move.
message ProjectMove {
    string project_id = 1;
    string from_region = 2;
    string to_region = 3;
    // marking, draining, copying, flipping, done, failed.
    string step = 4;
    uint64 objects_total = 5;
    uint64 objects_copied = 6;
    // Set when the step is failed; the move may be started again.
    string error = 7;
    int64 started_ms = 8;
    // 0 while the move runs.
    int64 finished_ms = 9;
}

message Regions {
    repeated Region regions = 1;
}

message RegionRef {
    string name = 1;
}

// What a script declared at its top level, extracted from the code at
// publish; the code is the manifest.
message Capabilities {
    // Namespaces declared with `kv "name"`.
    repeated string kv = 1;
    // Events declared with `on "event"`.
    repeated string events = 2;
    // Secrets declared with `secret "name"`.
    repeated string secrets = 3;
    // Object classes declared with `object "Class" { ... }`.
    repeated string objects = 4;
    // Databases declared with `database "name"`.
    repeated string databases = 5;
    // Queues declared with `queue "name"`.
    repeated string queues = 6;
    // Workflow definitions declared with `workflow "name"`.
    repeated string workflows = 7;
    // Step literals found in the sources: the console's
    // declared-possible skeleton, a superset of what may run.
    repeated string workflow_steps = 8;
    // Topics each class publishes, as "Class:topic" (gate-hooked) or
    // "Class:topic=policy" for a built-in policy ("self"). Read from
    // the class table's `publishes` key at publish.
    repeated string publishes = 9;
    // Class lifecycle declarations: "Class:expire=30d" for a declared
    // lifespan, "Class:admit" for a creation gate.
    repeated string lifecycle = 10;
    // Connection classes declared with `connection "Class" { ... }`.
    repeated string connections = 11;
}

message ScriptConfig {
    string id = 1;
    string entry_point = 2;
    repeated string includes = 3;
    repeated string ignore = 4;
    // Derived from the code by `actias publish`, never hand-written.
    optional Capabilities capabilities = 5;
}

message CreateRevisionRequest {
    string script_id = 1;
    ScriptConfig script_config = 2;
    bundle.Bundle bundle = 3;
}

message GetRevisionRequest {
    string id = 1;
    // Should bundle be included with revision.
    // If false then this will only include revision info.
    bool with_bundle = 2;
    // With with_bundle, return the manifest without file content: hashes,
    // sizes and kinds only. Callers with blob store access pull the bytes
    // themselves, so bundles stop transiting this service.
    bool manifest_only = 3;
}

// Return revision info.
message ListRevisionsRequest {
    int32 page_size = 1;
    int32 page = 2;
    // Script id, otherwise this will show all revisions in general.
    optional string script_id = 3;
}

// List of revision info.
message ListRevisionResponse {
    int32 page = 1;
    int32 total_pages = 2;
    repeated Revision revisions = 3;
}

message DeleteRevisionRequest {
    string revision_id = 1;
}

// A named environment: a mutable pointer from (script, name) to one
// revision. Rollback is moving the pointer.
message Alias {
    string script_id = 1;
    string name = 2;
    string revision_id = 3;
}

message SetAliasRequest {
    string script_id = 1;
    string name = 2;
    string revision_id = 3;
}

message GetAliasRequest {
    string script_id = 1;
    string name = 2;
}

message ListAliasesRequest {
    string script_id = 1;
}

message ListAliasesResponse {
    repeated Alias aliases = 1;
}

message SetRevisionRequest {
    string script_id = 1;
    // New revision ID.
    // This must be owned by the `script_id`
    string revision_id = 2;
}

// Response sent when revision of a script is changed.
message NewRevisionResponse {
    string script_id = 1;
    // New revision ID.
    optional string revision_id = 2;
}

// Find an existing script by id.
message FindScriptRequest {
    oneof query {
        string id = 1;
        string public_name = 2;
    }
}

message Revision {
    string id = 1;
    string created = 2;
    string script_id = 3;
    ScriptConfig script_config = 4;

    // Content bundle.
    optional bundle.Bundle bundle = 5;
}

// A live development script. This is temporary.
message LiveScript {
    // If this is provided then it will override past bundle/config.
    optional string session_id = 1;
    string script_id = 2;
    ScriptConfig script_config = 3;
    bundle.Bundle bundle = 4;
}

message LiveScriptSession {
    // Script to look for session in.
    string script_id = 1;
    // A session ID, this can be used to get the session bundle.
    string session_id = 2;
}

// One log line a running script emitted.
message LogMessage {
    // Level name: debug, info, warn or error.
    string level = 1;
    // The rendered line.
    string message = 2;
    // Milliseconds since the unix epoch, stamped by the worker.
    int64 timestamp_ms = 3;
}

// Names the script whose production log stream to follow.
message StreamScriptLogsRequest {
    string script_id = 1;
}

// Content hashes a client is about to reference.
message MissingBlobsRequest {
    // blake3 hashes, lowercase hex.
    repeated string hashes = 1;
}

// The subset of the asked-about hashes the store does not hold; a client
// only needs to upload these.
message MissingBlobsResponse {
    repeated string missing = 1;
}


message Script {
    string id = 1;
    // Project that owns the script.
    string project_id = 2;
    // Public identifier of the script.
    string public_identifier = 3;
    string last_updated = 4;
    optional string current_revision_id = 5;
}

message ResolveClassOwnerRequest {
    // Project the object identity is scoped to.
    string project_id = 1;
    // Object class the owner is resolved for: a user class resolves its
    // declaring script, `__queue` the consumer (`on "queue:<name>"`),
    // `__database` a declarer.
    string class = 2;
    // Instance name; platform classes resolve by it, user classes by the
    // class alone.
    string name = 3;
}

// The script whose current revision's code an object of the asked-about
// identity runs.
message ClassOwner {
    string script_id = 1;
}

service ScriptService {
    rpc QueryScript(FindScriptRequest) returns (Script);
    rpc ListScripts(ListScriptRequest) returns (ListScriptResponse);
    rpc CreateScript(CreateScriptRequest) returns (Script);
    rpc DeleteScript(DeleteScriptRequest) returns (google.protobuf.Empty);
    rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);
    rpc SetScriptRevision(SetRevisionRequest) returns (NewRevisionResponse);

    rpc GetRevision(GetRevisionRequest) returns (Revision);
    rpc CreateRevision(CreateRevisionRequest) returns (Revision);
    rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionResponse);
    rpc DeleteRevision(DeleteRevisionRequest) returns (NewRevisionResponse);

    rpc PutLiveSession(LiveScript) returns (LiveScriptSession);
    rpc GetLiveSession(LiveScriptSession) returns (LiveScript);
    rpc DeleteLiveSession(LiveScriptSession) returns (google.protobuf.Empty);

    // Follow one live session's log lines as they happen.
    rpc StreamLiveLogs(LiveScriptSession) returns (stream LogMessage);
    // Follow a script's production log lines as they happen.
    rpc StreamScriptLogs(StreamScriptLogsRequest) returns (stream LogMessage);

    // Which of these content hashes the blob store does not hold yet.
    rpc MissingBlobs(MissingBlobsRequest) returns (MissingBlobsResponse);

    // Which script's code an object identity runs, derived from the
    // project's current capability contracts; NOT_FOUND when no current
    // contract owns it.
    rpc ResolveClassOwner(ResolveClassOwnerRequest) returns (ClassOwner);

    // Named environments over revisions; set is upsert, so a move and a
    // create are the same call.
    rpc SetAlias(SetAliasRequest) returns (Alias);
    rpc GetAlias(GetAliasRequest) returns (Alias);
    rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse);

    // A project's runtime policy; get answers the defaults for a project
    // that never set one, set is an upsert.
    rpc GetProjectPolicy(ProjectRef) returns (ProjectPolicy);
    // Replaces the rates and the host lists; the region and the moving
    // flag are not part of it and stay as they were.
    rpc SetProjectPolicy(ProjectPolicy) returns (ProjectPolicy);
    rpc SetProjectRegion(SetProjectRegionRequest) returns (ProjectPolicy);
    // Moves a project to another home: marks it moving, drains, copies
    // its objects' bytes between the regions' buckets, flips the home,
    // clears the mark (FLEET.md 6.3). Returns at once; GetProjectMove
    // follows it. Both regions must be registered.
    rpc MoveProject(SetProjectRegionRequest) returns (ProjectMove);
    rpc GetProjectMove(ProjectRef) returns (ProjectMove);
    // The regions registered with the control plane. Empty on a
    // single-region deployment, which routes everything home.
    rpc ListRegions(google.protobuf.Empty) returns (Regions);
    // Registers or updates a region; the name is its identity.
    rpc PutRegion(Region) returns (Region);
    rpc DeleteRegion(RegionRef) returns (google.protobuf.Empty);
}