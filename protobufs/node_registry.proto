syntax = "proto3";

import "google/protobuf/empty.proto";

package node_registry;

// The placement store, served by the placement service, one per region:
// every worker node announces itself here and proves liveness by
// heartbeat, claims objects under leases that live as long as it does,
// mirrors its alarms, and reads the instance directory.
service NodeRegistryService {
    // A booting node introduces itself and receives its identity and the
    // cadence it must heartbeat at.
    rpc Register(RegisterNodeRequest) returns (NodeRegistration);

    // Periodic liveness and load report. NOT_FOUND means the node has
    // already aged out and must register again.
    rpc Heartbeat(HeartbeatRequest) returns (google.protobuf.Empty);

    // Every node considered alive right now; the aged-out are gone.
    rpc ListNodes(google.protobuf.Empty) returns (ListNodesResponse);

    // One node by id, alive or NOT_FOUND; the address a forwarded object
    // call travels to.
    rpc GetNode(GetNodeRequest) returns (Node);

    // Claims one object for one node. A lease lives exactly as long as its
    // holder stays in the registry, so expiry is node age-out; a claim
    // against a dead holder frees it and wins.
    rpc AcquireLease(AcquireLeaseRequest) returns (Lease);

    // Releases a lease the node still holds; a rehoming courtesy, never
    // required for correctness.
    rpc ReleaseLease(ReleaseLeaseRequest) returns (google.protobuf.Empty);

    // Who holds one object right now, without claiming: dead holders read
    // as unheld. NOT_FOUND when nobody does; how a read finds the node
    // with the freshest copy.
    rpc GetLease(GetLeaseRequest) returns (Lease);

    // Raises the holder's epoch to at least `at_least`: the wake path
    // asks this when the store's manifest (or deletion marker) sits at
    // or above the epoch the claim minted, so the residency ships above
    // everything the identity ever landed. Answers the lease as it
    // stands; NOT_FOUND when the caller does not hold the object.
    rpc RaiseEpoch(RaiseEpochRequest) returns (Lease);

    // The forwarding row for an object born here: a claim against it
    // answers `moved_to` instead of a lease (FLEET.md 4.2).
    rpc SetMove(SetMoveRequest) returns (google.protobuf.Empty);
    rpc GetMove(MoveRef) returns (Move);
    rpc ClearMove(MoveRef) returns (google.protobuf.Empty);

    // A graceful shutdown's goodbye: deletes the node row immediately,
    // freeing its leases through the same cascade age-out uses, so a
    // deploy never serves a minute of dead forwards while the ttl runs
    // out. Best effort; a crash still ages out.
    rpc Deregister(DeregisterRequest) returns (google.protobuf.Empty);

    // Object identities from the instance directory, which outlives the
    // contracts that declared them; filterable by class and name prefix,
    // always paged, because per-user classes grow with the user table.
    rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);

    // How many directory identities each class holds, per project: what
    // a console rail shows before anyone asks for actual names.
    rpc CountInstances(CountInstancesRequest) returns (CountInstancesResponse);
    // One identity's directory row; NOT_FOUND when nothing ever
    // claimed it. The script service's orphan fallback reads it.
    rpc GetInstance(InstanceRef) returns (ObjectInstance);

    // Mirrors one object's armed alarm; setting replaces. Written by the
    // hosting node asynchronously, OFF the call's transaction, so a
    // spurious row (a rolled-back arm) only ever costs a wasted wake.
    rpc SetAlarm(SetAlarmRequest) returns (google.protobuf.Empty);

    // Drops one object's mirrored alarm; written when it fires or clears.
    rpc ClearAlarm(ClearAlarmRequest) returns (google.protobuf.Empty);

    // Every mirrored alarm due at `now_ms`, oldest first: the sweep, as
    // one indexed query any live node can serve. Rows deliberately
    // outlive their holder's death; waking is claiming.
    rpc DueAlarms(DueAlarmsRequest) returns (DueAlarmsResponse);

    // Tombstone an instance and bump its epoch in one transaction: the
    // deletion commit point. Everything after it is retryable cleanup
    // under a newer epoch than any pre-deletion holder ever held.
    rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);

    // Finish a deletion: release the lease and drop the directory row.
    // Idempotent, so the janitor can retry it from the tombstone.
    rpc PurgeInstance(PurgeInstanceRequest) returns (google.protobuf.Empty);

    // Instances past their declared lifespan with no pending alarm; the
    // expiry sweep's batch, arbitrated again inside DeleteInstance.
    rpc DueExpiries(DueExpiriesRequest) returns (DueExpiriesResponse);

    // Tombstoned rows whose cleanup did not finish (a crash between
    // the tombstone and the purge); the janitor retries them from the
    // tombstone. now_ms is a grace cutoff: only rows tombstoned before
    // it answer, so an in-flight deletion is not raced.
    rpc UnfinishedDeletions(DueExpiriesRequest) returns (UnfinishedDeletionsResponse);

    // Unwinds a claim whose admission gate refused: lease and directory
    // row go, and the epoch row goes ONLY if this claim minted it, so a
    // hammered junk name leaves nothing while any identity that ever
    // lived keeps its fence.
    rpc RollbackAdmission(PurgeInstanceRequest) returns (google.protobuf.Empty);

    // Takes one undrained departure and the identities the dead node
    // held, for the crash-scoped directory sweep. A node that exits
    // cleanly flushed its shipper and syncer to zero and leaves nothing
    // to repair; a node that DIED may have settled a write whose row
    // never reached a delta, and leases cascade away with the node row,
    // so this record is the only durable answer to "what did it hold".
    //
    // Consuming: the row is deleted as it is handed out, so two sweepers
    // cannot take the same departure and a taken one is never retried.
    // That trades a crash mid-sweep (the departure is lost, and the
    // periodic reconciliation covers those objects later) against
    // duplicated work on every node, which is the right way round: the
    // repair is idempotent but not free.
    rpc TakeDeparture(google.protobuf.Empty) returns (Departure);
}

// One dead node's objects, resolved to identities. Empty `node_id`
// means there was nothing to take.
message Departure {
    string node_id = 1;
    repeated ObjectInstance instances = 2;
}

message ListInstancesRequest {
    repeated string project_ids = 1;
    // The class listed; required, so every listing is one class of one
    // scope. The classes themselves come from CountInstances.
    string class = 2;
    // Only names starting with this prefix; how a type-ahead picker
    // narrows a class too large to browse. Empty matches everything.
    string name_prefix = 3;
    // Rows per page; the server clamps unreasonable values.
    uint32 page_size = 4;
    // Zero-based page over the filtered, (class, name)-ordered rows.
    uint32 page = 5;
}

message InstanceRef {
    string scope_id = 1;
    string class = 2;
    string name = 3;
}

message CountInstancesRequest {
    repeated string project_ids = 1;
}

message ClassCount {
    string class = 1;
    uint64 count = 2;
    // XOR over a fixed hex prefix of each LIVE identity's object id,
    // which is already a hash of the identity. The directory folds its
    // own rows the same way and compares: a count cannot see one
    // missing row against one ghost, and this can.
    int64 identities = 3;
}

message CountInstancesResponse {
    // One row per class holding at least one identity, class-ordered.
    repeated ClassCount counts = 1;
}

message ObjectInstance {
    // Identity scope: the project for resource classes. Cron rows scope
    // to their script and never surface in a project listing.
    string scope_id = 1;
    string class = 2;
    string name = 3;
    // Script whose code the object ran when first claimed; directory
    // metadata ("declared by"), never identity.
    string script_id = 4;
    // Unix milliseconds of the first claim.
    int64 created_ms = 5;
    // When the platform deletes it if untouched; 0 = never.
    int64 expire_at_ms = 6;
    // Tombstone time; 0 = live. A nonzero row is a deletion in
    // progress: visible so the console can say "deleting", refused by
    // claims, drained by the janitor.
    int64 deleted_at_ms = 7;
    // The pending alarm's due time; 0 = none. An alarm blocks expiry.
    int64 alarm_due_ms = 8;
    // The lease holder; empty = cold (next touch revives).
    string node_id = 9;
    // Own-key of the creating object when the first claim originated
    // inside another object's call; empty otherwise. Cascade data.
    string created_by = 10;
    // The identity's hash: the lease key, the file name, the store
    // prefix. What a move copies by.
    string object_id = 11;
}

message ListInstancesResponse {
    repeated ObjectInstance instances = 1;
    // Rows matching the filter across every page, so a picker can say
    // "12,340 more".
    uint64 total = 2;
}

message GetNodeRequest {
    string node_id = 1;
}

message AcquireLeaseRequest {
    // blake3 of the object identity, hex.
    string object_id = 1;
    string node_id = 2;
    // The identity the hash was made from: (scope, class, name), where
    // the scope is the project for every resource class and the script
    // for `__cron` (a schedule belongs to its script, so equal
    // expressions across a project never collide). Recorded in the
    // instance directory so object data stays enumerable after the
    // declaring revision is gone.
    string scope_id = 3;
    string class = 4;
    string name = 5;
    // The owner script whose code the object runs; directory metadata,
    // never part of the identity.
    string script_id = 6;
    // The class's declared lifespan: expire_at is stamped now + this on
    // every claim, so touch refreshes and policy changes apply on the
    // next touch. 0 = the class never expires.
    uint64 expire_secs = 7;
    // Own-key of the creating object when this first claim originates
    // inside another object's call; empty otherwise. Kept from the
    // FIRST claim only.
    string created_by = 8;
}

message DeleteInstanceRequest {
    // The identity preimage names the directory row.
    string scope_id = 1;
    string class = 2;
    string name = 3;
    // blake3 of the identity, hex: the epoch and alarm key. The worker
    // computes it; the registry never hashes, and an empty value reads
    // the hash from the directory row (external deletion's path).
    string object_id = 4;
    // The expiry sweep's guard: tombstone only if still past due with
    // no pending alarm, so a claim that refreshed the row between the
    // sweep's query and this call wins. External deletion passes false.
    bool only_if_expired = 5;
}

message DeleteInstanceResponse {
    // False when the guard refused; nothing changed.
    bool tombstoned = 1;
    // The bumped epoch fencing everything after the tombstone.
    uint64 epoch = 2;
}

message PurgeInstanceRequest {
    string scope_id = 1;
    string class = 2;
    string name = 3;
    string object_id = 4;
}

message DueExpiriesRequest {
    int64 now_ms = 1;
    // Batch bound; the server clamps unreasonable values.
    uint32 limit = 2;
}

message ExpiryRow {
    string scope_id = 1;
    string class = 2;
    string name = 3;
}

message DueExpiriesResponse {
    repeated ExpiryRow rows = 1;
}

message DeletionRow {
    string scope_id = 1;
    string class = 2;
    string name = 3;
    // The epoch the tombstone bumped to; what the marker manifest
    // carries.
    uint64 epoch = 4;
}

message UnfinishedDeletionsResponse {
    repeated DeletionRow rows = 1;
}

message Lease {
    string object_id = 1;
    // Whoever holds it now: the claimant on success, the incumbent on
    // refusal.
    string node_id = 2;
    bool acquired = 3;
    // Monotonic per-object claim counter; fences storage shipping, so a
    // zombie ex-owner's uploads lose to any newer epoch.
    uint64 epoch = 4;
    // True when this claim created the directory row: a fresh identity,
    // the only kind an admission gate examines.
    bool fresh = 5;
    // Set when this store, the object's birth region, holds a forwarding
    // row: the object lives in that region now, no lease was taken, and
    // the caller forwards there once. Empty otherwise.
    string moved_to = 6;
}

// A forwarding row at the object's birth region: where the object
// lives now. Written by a move, cleared when the object comes home.
message SetMoveRequest {
    string object_id = 1;
    string region = 2;
}

message MoveRef {
    string object_id = 1;
}

message Move {
    string object_id = 1;
    // Empty when the object is at its birth region.
    string region = 2;
}

message RaiseEpochRequest {
    string object_id = 1;
    string node_id = 2;
    uint64 at_least = 3;
}

message ReleaseLeaseRequest {
    string object_id = 1;
    string node_id = 2;
}

message GetLeaseRequest {
    // blake3 of the object identity, hex.
    string object_id = 1;
}

message DeregisterRequest {
    string node_id = 1;
}

message SetAlarmRequest {
    // blake3 of the object identity, hex.
    string object_id = 1;
    // The object's own key (scope/class/name), what a wake needs.
    string own_key = 2;
    // Unix milliseconds the alarm is due at.
    int64 due_ms = 3;
}

message ClearAlarmRequest {
    string object_id = 1;
}

message DueAlarmsRequest {
    // Alarms with due_ms at or before this instant are due.
    int64 now_ms = 1;
    // Largest batch one sweep asks for; the next sweep drains the rest.
    uint32 limit = 2;
}

message AlarmRow {
    string object_id = 1;
    string own_key = 2;
    int64 due_ms = 3;
}

message DueAlarmsResponse {
    repeated AlarmRow alarms = 1;
}

message RegisterNodeRequest {
    // Where other platform services reach this node's WorkerData grpc
    // service, host:port.
    string address = 1;
    // Roles the node serves, e.g. "http"; object hosting arrives later.
    repeated string capabilities = 2;
}

message NodeRegistration {
    string node_id = 1;
    // Missing several of these in a row ages the node out.
    uint32 heartbeat_interval_secs = 2;
}

message HeartbeatRequest {
    string node_id = 1;
    // Instantaneous load: requests in flight when the beat was sent.
    uint32 load = 2;
}

message Node {
    string node_id = 1;
    string address = 2;
    repeated string capabilities = 3;
    uint32 load = 4;
    string registered = 5;
    string last_heartbeat = 6;
}

message ListNodesResponse {
    repeated Node nodes = 1;
}
