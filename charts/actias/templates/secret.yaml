{{/*
The platform secrets that were given literal values. Entries pointing
at an existingSecret are absent here: the chart never copies a secret
it was only told the name of.
*/}}
{{- $literals := dict }}
{{- range $name, $entry := .Values.secrets }}
{{- if and $entry.value (not $entry.existingSecret) }}
{{- $_ := set $literals $entry.key $entry.value }}
{{- end }}
{{- end }}
{{- if and .Values.api.admin.password (not .Values.api.admin.existingSecret) }}
{{- $_ := set $literals "admin-password" .Values.api.admin.password }}
{{- end }}
{{- if $literals }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "actias.fullname" . }}-secrets
  labels:
    {{- include "actias.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $literals }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
