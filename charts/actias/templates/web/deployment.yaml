{{- $name := printf "%s-web" (include "actias.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "actias.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "actias.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "actias.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "actias.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "actias.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- include "actias.scheduling" (dict "root" . "component" .Values.web) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "actias.image" (dict "root" . "component" .Values.web) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # The browser reaches the api directly, so this is an
            # external origin rather than a cluster address.
            - name: API_URL
              value: {{ include "actias.apiOrigin" . | quote }}
            - name: MINIMAL_HOME
              value: {{ .Values.web.minimalHome | quote }}
            - name: WORKER_BASE
              value: {{ include "actias.workerBase" . | quote }}
            - name: WORKER_REVISION_BASE
              value: {{ include "actias.workerRevisionBase" . | quote }}
            {{- /* No otel env: the console carries no exporter, and
                   handing it one would advertise instrumentation that
                   does not exist. */}}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.web.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.web.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
