{{- $name := printf "%s-script" (include "actias.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "actias.labels" (dict "root" . "component" "script") | nindent 4 }}
spec:
  ports:
    - name: grpc
      port: 3000
      targetPort: grpc
  selector:
    {{- include "actias.selectorLabels" (dict "root" . "component" "script") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "actias.labels" (dict "root" . "component" "script") | nindent 4 }}
spec:
  {{- if not .Values.scriptService.autoscaling.enabled }}
  replicas: {{ .Values.scriptService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "actias.selectorLabels" (dict "root" . "component" "script") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "actias.labels" (dict "root" . "component" "script") | nindent 8 }}
    spec:
      {{- include "actias.scheduling" (dict "root" . "component" .Values.scriptService) | nindent 6 }}
      initContainers:
        {{- include "actias.waitFor" (dict "root" . "image" (include "actias.image" (dict "root" . "component" .Values.scriptService)) "name" "postgres" "host" (include "actias.postgresHost" .) "port" (include "actias.postgresPort" .)) | nindent 8 }}
      containers:
        - name: script-service
          image: {{ include "actias.image" (dict "root" . "component" .Values.scriptService) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "3000"
            {{- include "actias.databaseUrlEnv" (dict "root" . "database" "actias_script_service") | nindent 12 }}
            - name: REDIS_URL
              value: {{ include "actias.redisUrl" . | quote }}
            {{- include "actias.s3Env" . | nindent 12 }}
            - name: PLACEMENT_SERVICE_URI
              value: "http://{{ include "actias.fullname" . }}-placement:3000"
            - name: REGION
              value: {{ .Values.placement.region | quote }}
            {{- include "actias.otelEnv" (dict "root" . "service" "actias_script_service") | nindent 12 }}
            {{- with .Values.scriptService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 3000
          readinessProbe:
            grpc:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.scriptService.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.scriptService.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.scriptService.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
