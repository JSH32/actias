{{/*
Names this region to the control plane. A Job after install and
upgrade: it logs in to the api as the instance admin and PUTs
/regions/<name> with the addresses other regions and the control plane
reach this one on, plus this region's bucket and its S3 credentials,
which the control plane's mover uses to copy a project in or out.

A hook rather than a resource, because the api it talks to is either
this release's, which must be serving first, or another cluster's,
which is not gated by this install at all. The Job is idempotent: the
same body registers or updates.
*/}}
{{- if .Values.region.register.enabled }}
{{- $name := printf "%s-register-region" (include "actias.fullname" .) }}
{{- $admin := required "region.register.existingSecret or api.admin.existingSecret names the admin credentials the registration job logs in with" (default .Values.api.admin.existingSecret .Values.region.register.existingSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "actias.labels" (dict "root" . "component" "register-region") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "actias.labels" (dict "root" . "component" "register-region") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: register
          # The worker image: it carries curl and jq, and nothing else
          # has to be pulled.
          image: {{ include "actias.image" (dict "root" . "component" .Values.workers) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API
              value: {{ include "actias.controlPlaneAddr" (dict "root" . "service" "api" "suffix" "api") | quote }}
            - name: REGION
              value: {{ .Values.placement.region | quote }}
            - name: DATA_PLANE_ADDR
              value: {{ required "region.register.dataPlaneAddr is required to register the region" .Values.region.register.dataPlaneAddr | quote }}
            - name: PLACEMENT_ADDR
              value: {{ required "region.register.placementAddr is required to register the region" .Values.region.register.placementAddr | quote }}
            - name: BUCKET
              value: {{ default .Values.externalS3.bucket .Values.region.bucket | quote }}
            {{- include "actias.s3Env" . | nindent 12 }}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $admin }}
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $admin }}
                  key: password
          command:
            - bash
            - -ec
            - |
              until [ "$(curl -s -o /dev/null -w '%{http_code}' "$API/regions")" != 000 ]; do
                echo "waiting for the api at $API"; sleep 3
              done
              login=$(jq -n --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{auth: $u, password: $p}')
              token=$(curl -sf -X POST "$API/auth/login" -H 'Content-Type: application/json' -d "$login" | jq -r .token)
              [ -n "$token" ] && [ "$token" != null ] || { echo "admin login refused"; exit 1; }
              body=$(jq -n --arg d "$DATA_PLANE_ADDR" --arg p "$PLACEMENT_ADDR" --arg b "$BUCKET" \
                --arg e "$S3_ENDPOINT" --arg k "$S3_ACCESS_KEY" --arg s "$S3_SECRET_KEY" \
                '{dataPlaneAddr: $d, placementAddr: $p, bucket: $b, s3Endpoint: $e, s3AccessKey: $k, s3SecretKey: $s}')
              curl -sf -X PUT "$API/regions/$REGION" -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' -d "$body" >/dev/null
              echo "region $REGION registered at $DATA_PLANE_ADDR"
{{- end }}
