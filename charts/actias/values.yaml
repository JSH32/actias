# Default values install on kind with the bundled stores, provided the
# secrets below are set (values-kind.yaml sets throwaway ones). See the
# README for how the pieces fit; values-production.yaml is a worked
# external-everything example.

image:
  registry: ghcr.io/jsh32
  # Empty means Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Wildcard base for script hosting: scripts serve at <name>.<baseDomain>
# and the console links there. Empty disables subdomain routing; the
# path-prefix form on the workers keeps working.
baseDomain: ""

# OTLP endpoints; empty means no exporting. Two of them because the
# exporters differ: the rust services speak OTLP over grpc (a
# collector's 4317) and the api speaks OTLP over http/protobuf (its
# 4318). Giving either one the other's port drops its spans silently,
# so they are set separately rather than guessed from one value.
otelEndpoint: ""          # grpc, e.g. http://collector:4317
otelHttpEndpoint: ""      # http/protobuf, e.g. http://collector:4318

observability:
  dashboards:
    # Install the repo's Grafana dashboards as sidecar-labeled
    # ConfigMaps (grafana_dashboard: "1").
    enabled: false

# Platform secrets. Each takes a literal `value` (the chart renders a
# Secret) or an `existingSecret` whose `key` holds the value. Neither
# set = the install fails; there are no default secrets.
secrets:
  # Signs API sessions.
  jwtKey:
    value: ""
    existingSecret: ""
    key: jwt-key
  # Authenticates api-to-worker and worker-to-worker calls.
  internalToken:
    value: ""
    existingSecret: ""
    key: internal-token
  # Key-encryption key for secret-service. Base64, 32 bytes
  # (openssl rand -base64 32). Rotation adds a new id; old versions
  # keep resolving.
  masterKey:
    value: ""
    existingSecret: ""
    key: secret-master-key
  masterKeyId:
    value: "kek-1"
    existingSecret: ""
    key: secret-master-key-id

# One release is one control plane and one region. A second region is
# another release of this chart with the control plane off and the
# shared one's services named here: it renders the placement service,
# the workers and their stores, registers itself with the control
# plane (see `region.register`), and nothing else. See the README's
# "Regions" section and values-region.yaml.
controlPlane:
  enabled: true
  # The shared control plane's services, as this region's pods reach
  # them; required when enabled is false. The api is needed only by
  # the registration job.
  external:
    scriptService: ""    # http://host:3000
    secretService: ""    # http://host:3000
    kv: ""               # http://host:3000
    redis: ""            # redis://host:6379
    api: ""              # http://host:3000

# The region this release serves. `placement.region` names it.
region:
  # The region's object bucket: objects and directories ship here, and
  # a project move copies between regions' buckets. Empty means the
  # blob bucket, which is the single-region layout. A second region
  # needs its own, at an endpoint that also holds the control plane's
  # bundle bucket (workers pull bundles by hash from `externalS3.bucket`
  # at the same endpoint).
  bucket: ""
  # Register this region with the control plane: a Job after install
  # and upgrade that PUTs /regions/<name> on the api as the instance
  # admin. Without it a region exists only to its own pods; the
  # control plane offers homes, forwards calls and moves projects only
  # among the regions it knows.
  register:
    enabled: false
    # This region's workers as other regions' workers reach them for a
    # forwarded call: host:3100 of the worker service, routable across
    # regions.
    dataPlaneAddr: ""
    # This region's placement service as the control plane reaches it,
    # http://host:3000; a move lists the project's objects there.
    placementAddr: ""
    # The admin account the job logs in as: a Secret with keys
    # username and password. Defaults to api.admin.existingSecret.
    existingSecret: ""

# Stores: bundled (single replica, one PVC, dev-grade) or external.
# Production means external; bundled exists for kind and evaluation.
postgres:
  # A read replica's host for the control plane's runtime reads (script
  # pointers, revisions, policy, secrets). Empty: every read goes to the
  # primary. One per region in a multi-region deployment.
  readReplicaHost: ""
  bundled: true
  # Version and volume path are coupled: postgres 18 moved the data
  # directory. Change image and manifest together or neither.
  image: postgres:17
  auth:
    username: actias
    password: ""
    existingSecret: ""   # keys: username, password
  storage:
    size: 2Gi
    storageClass: ""
externalPostgres:
  # Needs a role that may CREATE DATABASE, or the four databases
  # pre-created (see README).
  host: ""
  port: 5432
  # The username comes from the secret below beside the password, so
  # there is no separate value for it.
  existingSecret: ""     # keys: username, password

redis:
  # Live log tails and pub/sub only; no durable state.
  bundled: true
  image: redis:7-alpine
  storage:
    size: 1Gi
    storageClass: ""
externalRedis:
  url: ""                # redis://host:6379

minio:
  # Blob store: script bundles and object snapshots.
  bundled: true
  image: minio/minio:latest
  auth:
    rootUser: minioadmin
    rootPassword: ""
    existingSecret: ""   # keys: root-user, root-password
  storage:
    size: 5Gi
    storageClass: ""
externalS3:
  endpoint: ""
  bucket: actias-blobs
  existingSecret: ""     # keys: access-key, secret-key

scylla:
  # A one-node scylla for trying the scylla backend on a single
  # region: developer mode, one shard, one PVC. It has none of the
  # benefit scylla exists for (see placement.backend) and is for kind
  # and evaluation only; a real scylla region names its cluster in
  # placement.scyllaNodes. Rendered only when placement.backend is
  # scylla.
  bundled: false
  image: scylladb/scylla:6.2
  storage:
    size: 2Gi
    storageClass: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  console: ""            # console host -> web
  api: ""                # api host -> api
  # The worker host is *.<baseDomain>, which needs a wildcard cert
  # (ACME requires a DNS01 solver; cert-manager is not installed).
  tls: []
  # tls:
  #   - hosts: ["*.scripts.example.com"]
  #     secretName: wildcard-scripts-tls

# Components. All of them accept resources, nodeSelector, tolerations,
# affinity, topologySpreadConstraints, priorityClassName, extraEnv,
# extraVolumes and extraVolumeMounts.

scriptService:
  repository: actias_script_service
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Node liveness ttl, seconds. A crashed worker's objects are
  # unreachable for at most this long.
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

secretService:
  repository: actias_secret_service
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# The placement store, one per region: claims, membership, alarms and
# the instance directory.
placement:
  repository: actias_placement_service
  replicas: 1
  # Leases live this long past a heartbeat, so it bounds how long a
  # crashed worker's objects stay unreachable.
  nodeTtlSecs: 45
  # The region this store serves; every regional table keys by it.
  region: local
  # postgres or scylla. The choice, in one paragraph:
  #
  # Postgres is one primary with transactions: a claim is one
  # statement, failover is the database's own (a replica promoted by
  # the operator or a managed service), and the whole store is a
  # database you already run. It is the right store for one region on
  # one node or a handful, which is every small deployment.
  #
  # Scylla is leaderless: every row lives on `replicationFactor` nodes
  # of the datacenter and a claim is a lightweight transaction across
  # them, so the placement store stays up through the loss of a node
  # with no failover step, and a region's store scales with its
  # workers. That is the benefit, and it exists only when the store
  # spans several nodes: a one-node scylla is a slower postgres with
  # more memory and no transactions across rows. Choose it for a
  # region that must survive node loss without an operator, and for a
  # fleet whose claim rate outgrows one primary; choose postgres
  # otherwise. Either way the store is per region and never talks to
  # another region's.
  backend: postgres
  # Comma-separated host:port of the scylla cluster, when backend is
  # scylla and scylla.bundled is false.
  scyllaNodes: ""
  scyllaDc: datacenter1
  replicationFactor: 3
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

kv:
  repository: actias_kv_service
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

api:
  repository: actias_api
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Registration by invite only.
  inviteOnly: false
  # First-run admin account; set all three or none.
  admin:
    username: ""
    email: ""
    password: ""
    existingSecret: ""   # keys: username, email, password
  # Outbound mail for invites; empty host means invite links are
  # copied from the console instead of sent.
  smtp:
    host: ""
    port: 587
    from: ""
    existingSecret: ""   # keys: user, pass
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

web:
  repository: actias_web
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Replace the marketing landing page with a plain sign-in front door.
  minimalHome: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

workers:
  repository: actias_worker_service
  # Scales freely; scale-down is ordinary pod deletion (see README).
  replicas: 2
  # Per-pod volume for object databases. A cache of the blob store,
  # not the source of truth; size it for the working set.
  storage:
    size: 5Gi
    storageClass: ""
  podDisruptionBudget:
    maxUnavailable: 1
  terminationGracePeriodSeconds: 45
  # Commonly adjusted settings; the rest of the worker's env goes
  # through extraEnv.
  tuning:
    # Idle seconds before an object's vm is dropped (state stays on
    # disk) and before a connection's vm hibernates.
    objectIdleSecs: 300
    connectionHibernateSecs: 300
    objectSweepSecs: 30
    objectReplicaTtlSecs: 30
    # Size cap per object database, MB.
    objectDbMaxMb: 1024
    # Warm vms per revision, built ahead of requests and objects.
    objectVmPool: 4
    # Tail replication: replicas per object, acks that answer a write (0
    # is shadow mode), how a replica makes an append durable, per-ack
    # budget in milliseconds.
    objectReplicas: 3
    objectQuorum: 2
    objectReplicaSync: fsync
    objectReplicaAckMs: 2000
    objectReplicaIdleSecs: 1800
    # WAL shipping: generation rotation sizes.
    objectWalRotateKb: 4096
    objectWalRotateFraction: 0.125
    objectMaxSegments: 64
    # Fair share by project: each bound is split among the projects using
    # it; shareFloor is the least any one gets, as a fraction.
    requestConcurrency: 1024
    blockingConcurrency: 64
    connectionLimit: 4096
    objectResidentLimit: 10000
    directoryQueryConcurrency: 64
    shareFloor: 0.05
    objectStoreParallel: 8
    # How long a write's reply may wait for durable storage before the
    # caller gets an unknown-outcome error, ms.
    objectAckGateMs: 10000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
